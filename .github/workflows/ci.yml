name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 型チェック、単体テスト、同梱の flow.yml とプロンプトの整合性検査
      - run: npm run check
      - name: init のスモークテスト
        run: |
          mkdir -p "$RUNNER_TEMP/target/.github/workflows" && cd "$RUNNER_TEMP/target" && git init -q
          printf 'name: CI\non: pull_request\njobs: {}\n' > .github/workflows/ci.yml
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm base
          node "$GITHUB_WORKSPACE/dist/cli.js" init --owner example --ref v0
          test -z "$(git status --porcelain)"              # 既定ではリポジトリに何も置かない
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor --offline
          node "$GITHUB_WORKSPACE/dist/cli.js" init --owner example --ref v0 --ci
          test "$(git status --porcelain | wc -l)" -eq 1   # --ci でワークフロー1つだけ
          grep -q 'workflows: \["CI"\]' .github/workflows/taskrail.yml
          node "$GITHUB_WORKSPACE/dist/cli.js" init --owner example --ref v0 --docs --issue-template --config
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor --offline
          node "$GITHUB_WORKSPACE/dist/cli.js" labels sync --dry-run
          node "$GITHUB_WORKSPACE/dist/cli.js" update --ref v9 --dry-run
