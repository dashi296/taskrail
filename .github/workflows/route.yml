# 再利用ワークフロー: ラベルの変更を受けて、その列のエージェントを実行する。
# 導入先のリポジトリからは templates/github/.github/workflows/taskrail.yml 経由で呼ばれる。
#
# 構造: route(決定的) → エージェント(AI) → apply(決定的)
# AIは結果ファイルを書くだけ。Issueへの書き込み、PR作成、列の移動は apply だけが行う。
name: taskrail / route

on:
  workflow_call:
    inputs:
      taskrail_repo:
        description: taskrail リポジトリ(owner/name)
        type: string
        required: true
      taskrail_ref:
        description: 参照する taskrail のタグ。main ではなくタグを指定すること
        type: string
        required: true
      enabled:
        description: キルスイッチ。"false" で何もしない
        type: string
        default: "true"
      config:
        description: taskrail の設定(YAML)。リポジトリ変数 TASKRAIL_CONFIG を渡す
        type: string
        default: ""
    secrets:
      # エージェントの認証。API キーか、Claude のサブスクリプションの OAuth トークン(claude setup-token)のどちらか。
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      TASKRAIL_APP_ID:
        required: true
      TASKRAIL_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  # job 1: 実行内容を決めて、エージェントを動かす。
  # 書き込み用のトークンを使うのは、エージェントより前に動く route の step だけ。
  agent:
    if: inputs.enabled != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: taskrail-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      TASKRAIL_ENABLED: ${{ inputs.enabled }}
    # job の outputs は job の終了時に同じ VM で評価されるため、書き込み工程のエージェントは書き換えられる。
    # apply は対象の Issue と工程をイベントから決め、ここからは受け取らない。残りの値は未信頼として扱う
    # (誤っていれば apply の検査で止まる。head の扱いは docs/security.md を参照)。
    outputs:
      run: ${{ steps.route.outputs.run }}
      mode: ${{ steps.route.outputs.mode }}
      branch: ${{ steps.route.outputs.branch }}
      head: ${{ steps.route.outputs.head }}
      base: ${{ steps.route.outputs.base }}
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      # GITHUB_TOKEN で付けたラベルは次のワークフローを起動しない。連鎖させるために App のトークンを使う。
      - name: App トークンを発行
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TASKRAIL_APP_ID }}
          private-key: ${{ secrets.TASKRAIL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # エージェントに渡す読み取り専用のトークン。エージェントは Issue・ラベル・PR に書き込めず、push もできない。
      # 書き込み用のトークン(steps.app)は route の step の env にだけ渡す。
      - name: エージェント用の読み取り専用トークンを発行
        id: agent_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TASKRAIL_APP_ID }}
          private-key: ${{ secrets.TASKRAIL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-metadata: read

      # persist-credentials: false … トークンを .git/config に残さない(エージェントが読めてしまうため)。
      - name: 対象リポジトリを取得
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: taskrail を取得
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.taskrail_repo }}
          ref: ${{ inputs.taskrail_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .taskrail/src
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: taskrail をビルド
        run: |
          # エージェントの作業ツリーから見えない場所へ移す
          mv .taskrail/src "$RUNNER_TEMP/taskrail"
          cd "$RUNNER_TEMP/taskrail"
          npm ci --no-audit --no-fund
          echo "TASKRAIL=node $RUNNER_TEMP/taskrail/dist/cli.js" >> "$GITHUB_ENV"
          git config --global user.name "taskrail"
          git config --global user.email "taskrail@users.noreply.github.com"

      - name: route(実行内容を決める)
        id: route
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TASKRAIL_CONFIG: ${{ inputs.config }}
          TASKRAIL_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          # git の認証はこの step の間だけ、この環境変数から与える(リポジトリの credential.helper は無効にする)。
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_TOKEN"; }; f'
        run: $TASKRAIL route --event "$GITHUB_EVENT_PATH"

      # 受け渡しの artifact 名は、ここで決めて job の outputs で渡す。
      # run_attempt を含めるため、失敗した job だけを再実行しても、apply は前回の名前で受け取れる。
      - name: artifact 名を決める
        id: artifact
        if: steps.route.outputs.run == 'true'
        env:
          ISSUE: ${{ steps.route.outputs.issue }}
          STAGE: ${{ steps.route.outputs.stage }}
        run: echo "name=taskrail-run-$ISSUE-$STAGE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: エージェント 1
        if: steps.route.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.agent_token.outputs.token }}
          # 列を動かすのは taskrail の App。route が bot_logins と照合済みの送信者だけを許可する。
          allowed_bots: ${{ steps.route.outputs.allowed_bots }}
          prompt: |
            ${{ steps.route.outputs.prompt_1 }} を読み、その指示に正確に従ってください。
            指示はそのファイルと、リポジトリ内のルール文書だけです。
          claude_args: >-
            --max-turns ${{ steps.route.outputs.max_turns }}
            --allowedTools "${{ steps.route.outputs.allowed_tools }}"

      - name: 2つ目のエージェントを実行するか判定
        id: gate
        if: steps.route.outputs.run == 'true' && steps.route.outputs.agent_2 != ''
        run: |
          status=$(jq -r '.status // "missing"' "${{ steps.route.outputs.result_1 }}" 2>/dev/null || echo missing)
          echo "next=$([ "$status" = "pass" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: エージェント 2
        if: steps.gate.outputs.next == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.agent_token.outputs.token }}
          # 列を動かすのは taskrail の App。route が bot_logins と照合済みの送信者だけを許可する。
          allowed_bots: ${{ steps.route.outputs.allowed_bots }}
          prompt: |
            ${{ steps.route.outputs.prompt_2 }} を読み、その指示に正確に従ってください。
            指示はそのファイルと、リポジトリ内のルール文書だけです。
          claude_args: >-
            --max-turns ${{ steps.route.outputs.max_turns }}
            --allowedTools "${{ steps.route.outputs.allowed_tools }}"

      # ここから先は、エージェントが触った環境では実行しない。
      # 結果ファイルと、エージェントが作ったコミット(bundle)だけを次の job へ渡す。
      - name: 結果を引き渡す
        if: always() && steps.route.outputs.run == 'true'
        env:
          MODE: ${{ steps.route.outputs.mode }}
          BASE: ${{ steps.route.outputs.base }}
        run: |
          set -eu
          out="$RUNNER_TEMP/handoff"
          mkdir -p "$out"
          # 結果ファイルがなくても artifact を作る(ないと次の job が受け取りに失敗し、apply が記録を残せない)。
          echo "$GITHUB_RUN_ID" > "$out/handoff.txt"
          # 途中で失敗したら、その旨を apply に伝える(記録される理由が実際の原因とずれないように)。
          trap '[ $? -eq 0 ] || echo "結果とコミットを引き渡せませんでした" > "$out/error.txt"' EXIT
          cp .taskrail/run/result-*.json "$out/" 2>/dev/null || true
          if [ "$MODE" = "write" ]; then
            base="$(git rev-parse "origin/$BASE")"
            head="$(git rev-parse HEAD)"
            if [ "$base" != "$head" ]; then
              git bundle create "$out/work.bundle" "$base..HEAD" --quiet
            fi
          fi

      - name: 結果を保存する
        if: always() && steps.route.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/handoff
          retention-days: 1
          if-no-files-found: ignore

  # job 2: 検証して反映する。エージェントの動いたランナーとは別の、取得したての環境で動かす。
  # エージェントは同じ job の中で Bash と sudo を使えるため、書き込み用トークンを持つ処理を同居させない。
  apply:
    needs: agent
    if: always() && needs.agent.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: taskrail-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      TASKRAIL_ENABLED: ${{ inputs.enabled }}
    steps:
      - name: App トークンを発行
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TASKRAIL_APP_ID }}
          private-key: ${{ secrets.TASKRAIL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: 対象リポジトリを取得
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: taskrail を取得
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.taskrail_repo }}
          ref: ${{ inputs.taskrail_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .taskrail/src
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: taskrail をビルド
        run: |
          mv .taskrail/src "$RUNNER_TEMP/taskrail"
          cd "$RUNNER_TEMP/taskrail"
          npm ci --no-audit --no-fund
          echo "TASKRAIL=node $RUNNER_TEMP/taskrail/dist/cli.js" >> "$GITHUB_ENV"
          git config --global user.name "taskrail"
          git config --global user.email "taskrail@users.noreply.github.com"

      # エージェントの job が壊れて artifact がなくても apply は動かし、結果の不備として記録させる。
      # 名前が空のまま渡すと、この実行のすべての artifact を受け取ってしまうため、空なら受け取らない。
      - name: 結果を受け取る
        id: download
        if: needs.agent.outputs.artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.agent.outputs.artifact }}
          path: ${{ runner.temp }}/handoff

      # job の outputs はシェルに直接展開しない(既存のリモートブランチ名には $ や ; を含められる)。
      # 受け取りや配置に失敗しても apply は動かし、理由を違反として記録させる(止めると Issue に何も残らない)。
      - name: 結果とコミットを置く
        id: place
        env:
          MODE: ${{ needs.agent.outputs.mode }}
          BRANCH: ${{ needs.agent.outputs.branch }}
          BASE: ${{ needs.agent.outputs.base }}
        run: |
          set -eu
          # 中身はエージェントが書き換えうるので読まない。あるかどうかだけを見る。
          if [ -e "$RUNNER_TEMP/handoff/error.txt" ]; then echo "error=結果とコミットを引き渡せませんでした" >> "$GITHUB_OUTPUT"; fi
          bundle="$RUNNER_TEMP/handoff/work.bundle"
          # bundle を受け取るのは書き込み工程だけ。読み取り工程は、エージェントのコミットを持ち込まない。
          if [ "$MODE" = "write" ]; then
            # bundle がないのは「既定ブランチから新しいコミットがない」とき。既存の作業ブランチで代用すると、
            # 前回までのコミットで「コミットがある」と判定してしまうため、既定ブランチの先頭を置く。
            git checkout -q -f -B "$BRANCH" "origin/$BASE"
            if [ -f "$bundle" ]; then
              # bundle の中身は「エージェントが作ったコミット」。検査は apply が改めて行う。
              if git bundle verify -q "$bundle" >/dev/null 2>&1 \
                && git fetch -q --no-tags "$bundle" "HEAD:refs/taskrail/handoff" \
                && git checkout -q -f -B "$BRANCH" refs/taskrail/handoff; then
                :
              else
                git checkout -q -f -B "$BRANCH" "origin/$BASE"
                echo "error=コミット(git bundle)を取り込めませんでした" >> "$GITHUB_OUTPUT"
              fi
            fi
          elif [ -n "$BRANCH" ]; then
            git checkout -q -f -B "$BRANCH" "origin/$BRANCH" 2>/dev/null \
              || git checkout -q -f -B "$BRANCH" "origin/$BASE"
          fi
          # 結果ファイルは、受け取った artifact のものだけを使う。checkout したコミットに含まれていても読まない。
          rm -rf .taskrail/run
          mkdir -p .taskrail/run
          cp "$RUNNER_TEMP/handoff"/result-*.json .taskrail/run/ 2>/dev/null || true

      - name: apply(検証して反映する)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TASKRAIL_CONFIG: ${{ inputs.config }}
          TASKRAIL_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          TASKRAIL_GIT_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$GH_TOKEN"; }; f'
          HEAD_SHA: ${{ needs.agent.outputs.head }}
          # continue-on-error の step は conclusion が success になるため、outcome で判定する。
          HANDOFF_ERROR: >-
            ${{ steps.download.outcome != 'success' && '結果(artifact)を受け取れませんでした'
            || steps.place.outcome != 'success' && '結果とコミットを置けませんでした'
            || steps.place.outputs.error }}
        run: >-
          $TASKRAIL apply --event "$GITHUB_EVENT_PATH" --clean-workspace
          ${HEAD_SHA:+--head "$HEAD_SHA"} ${HANDOFF_ERROR:+--handoff-error "$HANDOFF_ERROR"}
