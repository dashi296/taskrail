# 再利用ワークフロー: AIを呼ばない、ボードの決定的な操作。実行するコマンドはイベントから決める。
#   dispatch: Ready → In Progress(WIP上限と依存関係を確認)       ← schedule / workflow_dispatch
#   advance:  CI成功 → Verify、修正依頼 → In Progress、マージ → Done ← workflow_run / pull_request_review / pull_request
#   resume:   blocked の Issue を回答コメントで再開                 ← issue_comment
# 対象が taskrail の作業ブランチかどうかは CLI が branch_prefix で判定する。
name: taskrail / board

on:
  workflow_call:
    inputs:
      taskrail_repo:
        type: string
        required: true
      taskrail_ref:
        type: string
        required: true
      enabled:
        type: string
        default: "true"
      config:
        description: taskrail の設定(YAML)。リポジトリ変数 TASKRAIL_CONFIG を渡す
        type: string
        default: ""
    secrets:
      TASKRAIL_APP_ID:
        required: true
      TASKRAIL_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  board:
    if: inputs.enabled != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: taskrail-board-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.event.issue.number || 'all' }}
      cancel-in-progress: false
    env:
      TASKRAIL_ENABLED: ${{ inputs.enabled }}
    steps:
      - name: App トークンを発行
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TASKRAIL_APP_ID }}
          private-key: ${{ secrets.TASKRAIL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # taskrail.yml を読むために取得する。信頼できない PR のコードは取得しない(既定ブランチのみ)。
      - name: 対象リポジトリの既定ブランチを取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app.outputs.token }}

      - name: taskrail を取得
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.taskrail_repo }}
          ref: ${{ inputs.taskrail_ref }}
          token: ${{ steps.app.outputs.token }}
          path: .taskrail/src

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: taskrail をビルド
        run: |
          mv .taskrail/src "$RUNNER_TEMP/taskrail"
          cd "$RUNNER_TEMP/taskrail" && npm ci --no-audit --no-fund
          echo "TASKRAIL=node $RUNNER_TEMP/taskrail/dist/cli.js" >> "$GITHUB_ENV"

      - name: イベントからコマンドを決めて実行
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TASKRAIL_CONFIG: ${{ inputs.config }}
          TASKRAIL_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          ev="$GITHUB_EVENT_PATH"
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch)
              $TASKRAIL dispatch ;;
            issue_comment)
              $TASKRAIL resume --event "$ev" ;;
            workflow_run)
              [ "$(jq -r .workflow_run.conclusion "$ev")" = success ] || exit 0
              $TASKRAIL advance --branch "$(jq -r .workflow_run.head_branch "$ev")" --from doing --to verify ;;
            pull_request_review)
              [ "$(jq -r .review.state "$ev")" = changes_requested ] || exit 0
              $TASKRAIL advance --branch "$(jq -r .pull_request.head.ref "$ev")" --from review --to doing ;;
            pull_request)
              [ "$(jq -r .pull_request.merged "$ev")" = true ] || exit 0
              $TASKRAIL advance --branch "$(jq -r .pull_request.head.ref "$ev")" --from review --to done ;;
            *)
              echo "対象外のイベント: $GITHUB_EVENT_NAME" ;;
          esac
