# taskrail の入口。ロジックと設定は {{TASKRAIL_OWNER}}/taskrail 側と、リポジトリ変数にあります。
# 更新は `taskrail update --ref <tag>` で行います(@ 以降と taskrail_ref が書き換わります)。
# 設定: リポジトリ変数 TASKRAIL_ENABLED(キルスイッチ)、TASKRAIL_CONFIG(任意。YAML)
name: taskrail

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: {{CI_WORKFLOWS}} # CI が成功したら In Progress → Verify
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 列の移動(ラベルの変更)→ その列のエージェントを実行
  route:
    if: github.event_name == 'issues'
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/route.yml@{{TASKRAIL_REF}}
    with:
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
      config: ${{ vars.TASKRAIL_CONFIG }}
    secrets: inherit

  # AIを使わないボード操作(着手、CI成功・修正依頼・マージの反映、回答での再開)。振り分けは board.yml が行う。
  board:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged)
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/board.yml@{{TASKRAIL_REF}}
    with:
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
      config: ${{ vars.TASKRAIL_CONFIG }}
    secrets: inherit
