# taskrail の薄い入口。ロジックは {{TASKRAIL_OWNER}}/taskrail 側にあり、ここはイベントを渡すだけです。
# バージョンの更新は `taskrail update --ref <tag>` で行います(@ 以降と taskrail_ref が書き換わります)。
name: taskrail

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["CI"] # ← このリポジトリのCIワークフローの name に合わせてください
    types: [completed]
  schedule:
    - cron: "*/10 * * * *" # Ready の Issue への着手判断
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 列の移動(ラベルの変更)→ その列のエージェントを実行
  route:
    if: github.event_name == 'issues'
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/route.yml@{{TASKRAIL_REF}}
    with:
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
    secrets: inherit

  # blocked の Issue に回答コメントが付いたら再開
  resume:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/board.yml@{{TASKRAIL_REF}}
    with:
      command: resume
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
    secrets: inherit

  # Ready → In Progress(WIP上限と依存関係を確認)
  dispatch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/board.yml@{{TASKRAIL_REF}}
    with:
      command: dispatch
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
    secrets: inherit

  # CI が緑になったら In Progress → Verify
  ci-passed:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'issue-')
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/board.yml@{{TASKRAIL_REF}}
    with:
      command: advance
      branch: ${{ github.event.workflow_run.head_branch }}
      from: doing
      to: verify
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
    secrets: inherit

  # 人間のレビューで修正依頼 → Human Review → In Progress
  changes-requested:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      startsWith(github.event.pull_request.head.ref, 'issue-')
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/board.yml@{{TASKRAIL_REF}}
    with:
      command: advance
      branch: ${{ github.event.pull_request.head.ref }}
      from: review
      to: doing
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
    secrets: inherit

  # マージ → Done
  merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'issue-')
    uses: {{TASKRAIL_OWNER}}/taskrail/.github/workflows/board.yml@{{TASKRAIL_REF}}
    with:
      command: advance
      branch: ${{ github.event.pull_request.head.ref }}
      from: review
      to: done
      taskrail_repo: {{TASKRAIL_OWNER}}/taskrail
      taskrail_ref: "{{TASKRAIL_REF}}"
      enabled: ${{ vars.TASKRAIL_ENABLED }}
    secrets: inherit
